apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/faqsarg/kubeplay.git
    targetRevision: main
    path: kubernetes/apps/frontend/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
