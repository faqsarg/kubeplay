# Production twin of externalsecret-staging.yaml: same recipe, but pulls the
# PRODUCTION secret and materializes it in the `production` namespace. The
# ClusterSecretStore (secretstore.yaml) is cluster-scoped, so it is shared — no
# per-environment copy needed there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
  data:
    - secretKey: password              # consumed by the "kubeplay" user AND the backend's DATABASE_URL
      remoteRef:
        key: kubeplay/production/postgres
        property: password
    - secretKey: postgres-password     # the "postgres" superuser (chart-internal only)
      remoteRef:
        key: kubeplay/production/postgres
        property: postgres-password
