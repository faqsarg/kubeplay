apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend      # ← the ServiceMonitor selects THIS Service by this label
spec:
  selector:
    app: backend      # ← capture pods with this label
  ports:
    - name: http         # ← the ServiceMonitor references the port by name, not number
      port: 8080         # port to access Service
      targetPort: 8080   # port where container listens (containerPort)
