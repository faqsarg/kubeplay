apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRODUCTION overlay = the SAME base + this environment's two decisions.
# The only differences vs the staging overlay are the namespace and the image tag.
resources:
- ../../base

namespace: production

# The image REPO is the same ECR repo as staging (one artifact store, promoted by
# immutable tag). Only newTag differs: it is NOT bumped by the merge-to-main CD —
# it is set by the release workflow (deploy-production.yml), which copies the
# staging-validated tag here on an approved `v*` git tag. Seeded with the current
# staging-validated SHA so it points at a real, existing, tested image from day one.
images:
- name: backend
  newName: 915170001562.dkr.ecr.eu-west-1.amazonaws.com/staging-backend
  newTag: 3072aa1cb3ba86072e1af2576a1edcd2f5c2e5a2
