apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The full backend app. Argo (and `kubectl apply -k`) render this single file to
# get every resource — no more applying each YAML by hand.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# The ONLY line that changes per release. deployment.yaml refers to the abstract
# name `backend`; this rewrites it to the real ECR repo + the tag to deploy.
# CI updates newTag on every merge to main via:
#   kustomize edit set image backend=<repo>:<sha>
images:
  - name: backend
    newName: 915170001562.dkr.ecr.eu-west-1.amazonaws.com/staging-backend
    newTag: latest   # seeded on first Argo bootstrap; then owned by CI
