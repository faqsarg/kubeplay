apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# STAGING overlay = base + this environment's two decisions (namespace + image).
resources:
- ../../base

namespace: default

# CI updates newTag on every merge to main via:
#   kustomize edit set image frontend=<repo>:<sha>  (run in THIS dir).
images:
- name: frontend
  newName: 915170001562.dkr.ecr.eu-west-1.amazonaws.com/staging-frontend
  newTag: 64a729f2cf2a613d40fdde1f5320836f9ed7091d
