apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRODUCTION overlay = the SAME base + namespace + image (see backend/overlays/
# production for the full rationale). newTag is set by deploy-production.yml on an
# approved `v*` tag, not by the merge-to-main CD. Seeded with a real tested image.
resources:
- ../../base

namespace: production

images:
- name: frontend
  newName: 915170001562.dkr.ecr.eu-west-1.amazonaws.com/staging-frontend
  newTag: 755f659f6688c3483a4ba779a18900e5d3c11e0c
