# CI — runs on every PR. Validates both apps: static checks, tests, and a docker
# build to prove each image compiles. It does NOT push to ECR — the deploy-staging
# workflow builds the authoritative image on merge to main. Because nothing is
# pushed, CI needs no AWS credentials at all, so a fork PR can never reach our registry.
name: CI

on:
  pull_request:
  workflow_dispatch:   # lets us trigger a run manually from the Actions tab

# No id-token needed anymore: without a push there's no OIDC exchange with AWS.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod   # single source of truth for the Go version

      # Static checks + tests. No tests exist yet, so `go test` exits 0 ("no test files").
      - name: Vet and test
        working-directory: apps/backend
        run: |
          go vet ./...
          go test ./...

      # Prove the image builds. Tagged locally, never pushed.
      - name: Build image
        run: docker build -t backend:ci apps/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t frontend:ci apps/frontend
